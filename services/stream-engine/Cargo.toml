[package]
name = "stream-engine"
version = "0.1.0"
edition = "2021"
description = "SanitizeDB Zero-Leak High-Throughput Streaming PII Anonymizer"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1"] }
futures-util = "0.3"
bytes = "1.7"
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
fake = { version = "2.9", features = ["derive"] }
regex = "1.11"
once_cell = "1.19"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
tonic-build = "0.12"
