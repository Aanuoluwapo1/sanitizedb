server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: sanitizedb-governance-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sanitizedb_control}
    username: ${SPRING_DATASOURCE_USERNAME:sanitizedb}
    password: ${SPRING_DATASOURCE_PASSWORD:control_plane_dev_secret}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
